[uwsgi]
strict
master
die-on-term
if-not-env = LISTEN_IPV6
http-socket = :8000
endif =
if-env = LISTEN_IPV6
http-socket = [::]:8000
endif =
harakiri = 10
buffer-size = 32768
post-buffering = 16192
# DATA_UPLOAD_MAX_MEMORY_SIZE, as hc/settings.py sets it while PING_BODY_LIMIT is
# 2621440 or less: a larger body is refused before uWSGI reads it. With a higher
# PING_BODY_LIMIT, set UWSGI_LIMIT_POST to it.
if-not-env = UWSGI_LIMIT_POST
limit-post = 2621440
endif =
if-not-env = UWSGI_PROCESSES
processes = 4
endif =
auto-procname
enable-threads
threads = 1
chdir = /opt/healthchecks
module = hc.wsgi:application
thunder-lock
disable-write-exception
disable-logging

# workaround for https://github.com/unbit/uwsgi/issues/2299
max-fd = 10000

# migrate also runs the system checks. As an asap hook, its failure stops uWSGI;
# a failed pre-app hook is only logged, and the master starts its workers anyway.
hook-asap = exec:./manage.py migrate
# Use "--skip-checks" to avoid running same checks 3 times
attach-daemon = ./manage.py sendalerts --skip-checks
attach-daemon = ./manage.py sendreports --loop --skip-checks
# Daily housekeeping. Times are UTC: Django sets TZ=UTC in this master.
# unique=1 skips a run while the last one is still going, and harakiri
# kills a stuck run after that many seconds.
cron2 = minute=17,hour=3,unique=1,harakiri=1800 ./manage.py prune --skip-checks
