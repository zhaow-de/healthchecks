# PostgreSQL 18 in place of SQLite, layered over docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# DB_PASSWORD comes from .env; this file sets the other DB_* variables of web.
volumes:
  db-data: {}

services:
  db:
    image: postgres:18
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: hc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    healthcheck:
      # Over TCP: while initdb runs, the server listens on its Unix socket alone
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      start_period: 60s
      start_interval: 1s
      interval: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    # DB_NAME replaces the image's SQLite path.
    environment:
      DB: postgres
      DB_HOST: db
      DB_NAME: hc
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
