volumes:
  db-data: {}

services:
  db:
    image: postgres:18
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_PASSWORD=$DB_PASSWORD
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # To use a pre-built image, remove the above "build" section
    # and uncomment the following line (`latest` is the newest build of main):
    # image: ghcr.io/zhaow-de/healthchecks:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; uwsgi /opt/healthchecks/docker/uwsgi.ini'
