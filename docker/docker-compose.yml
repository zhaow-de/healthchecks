# SQLite in the hc-data volume: the image sets DB_NAME=/data/hc.sqlite.
# For PostgreSQL, layer docker-compose.postgres.yml over this file:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
volumes:
  hc-data: {}

services:
  web:
    # In production, pin a release in .env, as
    # HC_IMAGE=ghcr.io/zhaow-de/healthchecks:v<version>; `latest` follows main.
    # To build this checkout instead, replace `image:` with:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    image: ${HC_IMAGE:-ghcr.io/zhaow-de/healthchecks:latest}
    env_file:
      - .env
    volumes:
      - hc-data:/data
    # Loopback only: a reverse proxy on this host terminates TLS and forwards here.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # The json-file driver keeps every line unless capped.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
