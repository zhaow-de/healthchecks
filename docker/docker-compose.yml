volumes:
  db-data: {}

services:
  db:
    image: postgres:18
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_PASSWORD=$DB_PASSWORD
    healthcheck:
      # Over TCP: while initdb runs, the server listens on its Unix socket alone
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      start_period: 60s
      start_interval: 1s
      interval: 60s
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # To use a pre-built image, remove the above "build" section
    # and uncomment the following line (`latest` is the newest build of main):
    # image: ghcr.io/zhaow-de/healthchecks:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
