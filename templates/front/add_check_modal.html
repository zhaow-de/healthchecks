<div id="add-check-modal" class="modal simple with-slug-suggestions" tabindex="-1">
    <div class="modal-dialog">
        <form method="post" action="{% url 'hc-add-check' project.code %}">
            {% csrf_token %}
            <input type="hidden" name="timeout" value="86400" />
            <input type="hidden" name="grace" value="3600" />

            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Add Check</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <label for="add-check-name" class="col-sm-3 col-form-label">
                            Name
                        </label>
                        <div class="col-sm-9">
                            <input
                                id="add-check-name"
                                name="name"
                                type="text"
                                maxlength="100"
                                class="form-control" />
                            <span class="form-text d-block">
                                Give this check a human-friendly name.
                            </span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="add-check-slug" class="col-sm-3 col-form-label">
                            Slug
                        </label>
                        <div class="col-sm-9">
                            <div class="input-group">
                                <input
                                    id="add-check-slug"
                                    name="slug"
                                    type="text"
                                    maxlength="100"
                                    value="{{ check.slug }}"
                                    pattern="[a-z0-9_\-]+"
                                    class="form-control" />
                                <button
                                    class="btn btn-outline-secondary use-suggested-slug"
                                    type="button">Use Suggested</button>
                            </div>
                            <span class="form-text d-block slug-help-block"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="add-check-tags" class="col-sm-3 col-form-label">
                            Tags
                        </label>
                        <div class="col-sm-9">
                            <input
                                id="add-check-tags"
                                name="tags"
                                type="text"
                                maxlength="500"
                                class="form-control" />
                            <span class="form-text d-block">
                                Separate multiple tags with spaces.
                            </span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">
                            Schedule
                        </label>
                        <div id="add-check-kind" class="col-sm-9 pt-2">
                            <label class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="kind" value="simple" checked>
                                Simple
                            </label>
                            <label class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="kind" value="cron">
                                Cron
                            </label>
                            <label class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="kind" value="oncalendar">
                                OnCalendar
                            </label>
                        </div>
                    </div>

                    <div class="row mb-3 create-simple-extra">
                        <label for="add-check-period" class="col-sm-3 col-form-label">
                            Period
                        </label>
                        <div class="col-sm-9">
                            <input
                                id="add-check-period"
                                type="number"
                                min="1"
                                class="form-control period-input"
                                value="1" />
                            <select id="add-check-period-unit" class="form-select period-input">
                                <option value="60">minutes</option>
                                <option value="3600">hours</option>
                                <option value="86400" selected>days</option>
                            </select>
                            <span class="form-text d-block">
                                The expected time between pings.
                            </span>
                        </div>
                    </div>

                    <div class="row mb-3 create-cron-extra">
                        <label for="add-check-schedule" class="col-sm-3 col-form-label">
                            Cron Expression
                        </label>
                        <div class="col-sm-9">
                            <input
                                id="add-check-schedule"
                                name="schedule"
                                type="text"
                                maxlength="100"
                                value="* * * * *"
                                class="form-control" />
                            <span class="form-text d-block">
                                <code>m h dom mon dow</code>
                            </span>
                        </div>
                    </div>

                    <div class="row mb-3 create-oncalendar-extra">
                        <label for="add-check-schedule-oncalendar" class="col-sm-3 col-form-label">
                            OnCalendar Expression(s)
                        </label>
                        <div class="col-sm-9">
                            <textarea
                                id="add-check-schedule-oncalendar"
                                name="schedule"
                                class="form-control"
                                rows="3"
                                maxlength="100">*-*-* *:*:*</textarea>
                        </div>
                    </div>

                    <div class="row mb-3 create-cron-extra create-oncalendar-extra">
                        <label for="add-check-tz" class="col-sm-3 col-form-label">
                            Time Zone
                        </label>
                        <div class="col-sm-9">
                            <select id="add-check-tz" name="tz" class="form-select"></select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="add-check-grace" class="col-sm-3 col-form-label">
                            Grace Time
                        </label>
                        <div class="col-sm-9">
                            <input
                                id="add-check-grace"
                                type="number"
                                min="1"
                                class="form-control grace-input"
                                value="1" />
                            <select id="add-check-grace-unit" class="form-select grace-input">
                                <option value="60">minutes</option>
                                <option value="3600" selected>hours</option>
                                <option value="86400">days</option>
                            </select>
                            <span class="form-text d-block">
                                When a check is late, or has received a "start" signal, how long to wait to send an alert.
                            </span>
                        </div>
                    </div>
                </div> <!-- modal-body -->

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button id="add-check-submit" type="submit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>
