# Installed per clone by `uv run pre-commit install`. The generated hooks exec this checkout's
# `.venv/bin/python` by absolute path, falling back to a `pre-commit` on PATH, else refusing every
# commit until `uv sync` rebuilds `.venv`.
# `uv run pre-commit run -a` runs the pre-commit stage alone; message-citations, the one commit-msg
# hook, needs a message file and runs from the installed hook.

# Files committed exactly as a tool writes them. Each of these tools writes its output without a
# final newline, so a fixer's edit would be undone the next time the tool runs:
#   .idea/                            JetBrains IDE project settings
#   templates/docs/*.html-fragment    ./manage.py render_docs
#   stuff/icons_icomoon_project.json  project export of the IcoMoon app
exclude: |
  (?x)^(
      \.idea/.*|
      templates/docs/.*\.html-fragment|
      stuff/icons_icomoon_project\.json
  )$

# Not the Python pre-commit was installed with, which may predate 3.14 and reject `except A, B:`.
default_language_version:
  python: python3.14

# Every hook is a commit-time hook unless it says otherwise. Without this line a hook whose manifest
# declares no stages runs at every installed hook type, the commit-msg one included.
default_stages: [pre-commit]
# `pre-commit install` installs the commit-msg hook type beside pre-commit, for message-citations,
# without a `--hook-type` per clone.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Five hooks below pin `stages: [pre-commit]`. Their upstream manifest declares
  # `[pre-commit, pre-push, manual]`, which outranks `default_stages`, and two of the five REWRITE
  # files — at push they would edit the working tree mid-push. The push stage is empty by design and
  # `tests/test_pre_push_stage.py` holds it there, so a hook arriving in it is a red, not a choice.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        stages: [pre-commit]
        # log_rows.html must render to an empty string when there are no events: static/js/log.js
        # treats any non-empty response as new rows. A final newline in the template would be
        # part of the response.
        exclude: '^templates/front/log_rows\.html$'
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        stages: [pre-commit]

  # Local, not the upstream mirror, so the one ruff is the one uv.lock pins and dependabot's `uv`
  # ecosystem bumps; the mirror would pin it a second time, and the two would drift.
  # `--force-exclude` applies ruff.toml's `exclude` to the paths pre-commit names as well.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  # shellcheck over every tracked file `identify` types as shell, by shebang or extension. A finding is
  # fixed in the script; a `# shellcheck disable=` stays only on the one line it is wrong for, with the
  # reason beside it.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]

  # `language_version` pins the Node that pre-commit installs through nodeenv, so a clone needs no Node
  # of its own, and one on PATH is not used.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: eslint --max-warnings=0
        language: node
        language_version: 24.21.0
        additional_dependencies: [eslint@10.12.0, globals@17.13.0]
        files: ^(static/js|hc/integrations/[^/]+/static/js)/.*\.js$

  # The one-kind-per-commit rule keeps claude-kind files apart; feat/fix commits legitimately mix code,
  # tests, templates and docs.
  - repo: local
    hooks:
      - id: staged-kind
        name: claude-kind files not mixed with other kinds
        entry: bash scripts/staged-kind-check.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: message-citations
        name: every citation in the message resolves
        entry: uv run python scripts/message-citations.py
        language: system
        stages: [commit-msg]
        always_run: true
