name: Image

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
    # What goes into the image: docker/Dockerfile copies the tree minus .dockerignore, and these
    # are the parts of it the image runs or is built from. GitHub does not evaluate path filters
    # on tag pushes, so every `v*` tag builds.
    paths:
      - "hc/**"
      - "templates/**"
      - "static/**"
      - "docker/**"
      - "manage.py"
      - "search.db"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
  # On-demand rebuilds; edits to this file match no path above.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zhaow-de/healthchecks

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # amd64 only, as the docs state; no QEMU step, since nothing is cross-built.
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pushed `v*` tag counts as a main build for `latest`: the release tags main.
      - name: Choose the tags
        id: tags
        run: |
          names=$GITHUB_SHA
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ $GITHUB_REF == refs/tags/v* ]]; then
            names="$names latest $GITHUB_REF_NAME"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            names="$names latest"
          fi
          {
            echo "refs<<EOF"
            for name in $names; do echo "$IMAGE:$name"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          # No provenance and no SBOM: each is an attestation, which GHCR lists as an `unknown/unknown` platform beside linux/amd64.
          provenance: false
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          # `revision` lets `docker inspect` name a digest's commit without a tag; `source` links the GHCR package to this repository.
          # No `version` label: branch builds would claim a release they are not.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write image digest to the job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REFS: ${{ steps.tags.outputs.refs }}
        run: |
          tags=
          for ref in $REFS; do tags="${tags:+$tags, }\`${ref#"$IMAGE":}\`"; done
          {
            echo "### Image pushed"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Tags: ${tags}"
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo "Pull exactly this build by its digest:"
            echo '```sh'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
