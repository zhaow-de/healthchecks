name: Coverage

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions: {}

jobs:
    test:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
            - name: Install uv
              uses: astral-sh/setup-uv@v10.2.0
              with:
                  version: "0.12.19"
            - name: Set up Python
              # Installs the version specified in .python-version. Keep this step:
              # without it uv would use the runner's system Python.
              run: uv python install
            - name: Install Dependencies
              run: uv sync --locked --group coverage
            - name: Run Tests
              env:
                  SECRET_KEY: dummy-key
              run: uv run --no-sync coverage run --omit=*/tests/*,*/migrations/* --source=hc manage.py test
            - name: Coveralls
              run: uv run --no-sync coveralls --service=github
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
