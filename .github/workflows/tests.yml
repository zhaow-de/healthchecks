name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        db: [sqlite, postgres, mysql, mariadb]
        include:
          - db: postgres
            db_user: runner
            db_password: ""
          - db: mysql
            db_user: root
            db_password: root
          - db: mariadb
            db_user: root
            db_password: ""

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - name: Set up Python
        # Installs the version specified in .python-version. Keep this step:
        # without it uv would use the runner's system Python.
        run: uv python install
      - name: Start MySQL
        if: matrix.db == 'mysql'
        run: sudo systemctl start mysql.service
      - name: Start PostgreSQL
        if: matrix.db == 'postgres'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s runner
      - name: Start MariaDB
        uses: ankane/setup-mariadb@v1
        if: matrix.db == 'mariadb'
      - name: Install Dependencies
        run: uv sync --locked --extra mysql
      - name: Run Tests
        env:
          DB: ${{ matrix.db }}
          DB_USER: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
          SECRET_KEY: dummy-key
        run: uv run --no-sync manage.py test
