name: Tests

on:
  # Pull requests only: every change reaches develop and main through one, so a push run after the merge would repeat the suite.
  pull_request:
    branches: [develop, main]

jobs:
  django:
    name: Django tests (${{ matrix.db }})
    runs-on: ubuntu-26.04
    # `actions/checkout` persists this token in .git/config for every later step; bound it whatever the repository default is.
    permissions:
      contents: read
    strategy:
      matrix:
        db: [sqlite, postgres]
        include:
          - db: postgres
            db_host: localhost
            db_user: postgres
            db_password: postgres
    # An empty `image` starts no service, so the sqlite leg runs without one.
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: ${{ matrix.db_password }}
        ports:
          - 5432:5432
        # The runner holds the first step until the container is healthy. The check goes over TCP: the image's
        # first-start server listens on the Unix socket alone, and stops before the real one starts.
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          # No cache: restoring one takes about as long as uv downloading the locked packages.
          enable-cache: false
      - name: Set up Python
        # Installs the version specified in .python-version. Keep this step:
        # without it uv would use the runner's system Python.
        run: uv python install
      - name: Install Dependencies
        run: uv sync --locked
      - name: Run Tests
        if: matrix.db != 'sqlite'
        env:
          DB: ${{ matrix.db }}
          DB_HOST: ${{ matrix.db_host }}
          DB_USER: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
        run: uv run --no-sync ./manage.py test
      # The SQLite leg runs the same tests under pytest with pytest-cov, so the numbers cost no extra run.
      - name: Run Tests with coverage
        if: matrix.db == 'sqlite'
        env:
          DB: ${{ matrix.db }}
        run: uv run --no-sync pytest hc -n auto --cov --cov-report=lcov:coverage.lcov
      - name: Upload coverage to Coveralls
        if: matrix.db == 'sqlite'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          # The action fails the job on an upload error by default, which would let a coveralls.io outage block every merge.
          fail-on-error: false
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  tooling:
    # The tests of the commit tooling under tests/, which `./manage.py test` does not discover.
    name: Tooling tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # The whole history, not the tip: `scripts/count-list.sh` reads develop's first-parent
      # commits, and a depth-1 clone has none of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Set up Python
        # Installs the version specified in .python-version. Keep this step:
        # without it uv would use the runner's system Python.
        run: uv python install
      # The branch under the name the tooling reads: a pull_request checkout is detached at the
      # merge ref with only `origin/develop`, and `scripts/count-list.sh` refuses a checkout with
      # no local `develop`.
      - run: git branch --force develop origin/develop
      - name: Install Dependencies
        run: uv sync --locked
      - name: Run Tests
        run: uv run --no-sync pytest -n auto

  suite:
    # This `name:` is the required context in .github/settings.yml and the check-run the open-pr and release skills wait for.
    # Renaming ALSO strands every pull request open at that moment: their runs already reported under the old name, and
    # a re-run replays the old workflow file, so each needs a fresh run (push a commit, or close and reopen) before it
    # can merge again.
    name: Full test suite
    needs: [django, tooling]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Both jobs succeeded
        env:
          DJANGO: ${{ needs.django.result }}
          TOOLING: ${{ needs.tooling.result }}
        run: |
          echo "Django tests: $DJANGO, tooling tests: $TOOLING"
          test "$DJANGO" = success && test "$TOOLING" = success
