name: Mypy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  main:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - name: Set up Python
        # Installs the version specified in .python-version. Keep this step:
        # without it uv would use the runner's system Python.
        run: uv python install
      - name: Install Dependencies
        run: |
          uv sync --locked
          touch hc/local_settings.py
      - name: Run Mypy
        run: uv run --no-sync mypy --strict --show-traceback hc
